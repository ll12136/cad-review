<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电子线路CAD 复习 · Altium Designer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='6' width='20' height='20' rx='4' fill='%232563eb'/><rect x='11' y='11' width='10' height='10' rx='2' fill='%23ffffff'/></svg>">
<style>
  :root{
    --bg:#f4f6f9; --paper:#ffffff; --ink:#1b2430; --ink2:#4b5563; --ink3:#8a94a3;
    --line:#e3e8ef; --accent:#2563eb; --accent-weak:#e8f0fe;
    --ok:#0f9d58; --ok-weak:#e6f4ea; --bad:#d93025; --bad-weak:#fce8e6;
    --warn:#b26a00; --warn-weak:#fef3d7;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px -8px rgba(16,24,40,.12);
  }
  html[data-theme="dark"]{
    --bg:#0f1319; --paper:#171c24; --ink:#e8edf4; --ink2:#b3bcc9; --ink3:#7b8695;
    --line:#26303c; --accent:#6ea8fe; --accent-weak:#1c2a3f;
    --ok:#43c17a; --ok-weak:#14301f; --bad:#ff6b60; --bad-weak:#37191a;
    --warn:#e0a33e; --warn-weak:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
  }
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 72px}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:20;background:var(--bg);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
  }
  .top-in{max-width:1000px;margin:0 auto;padding:10px 16px 0;}
  .brandrow{display:flex;align-items:center;gap:12px}
  .brand{font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:6px}
  .spacer{flex:1}
  .ringwrap{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .ring{width:34px;height:34px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:4}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .4s ease}
  .pct{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;
    padding:8px 12px 10px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;border-radius:8px 8px 0 0;
  }
  nav.tabs button:hover{background:var(--accent-weak);color:var(--accent)}
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

  /* ---------- generic ---------- */
  h1{font-size:22px;margin:24px 0 6px}
  h2{font-size:17px;margin:26px 0 10px}
  h3{font-size:15px;margin:18px 0 8px}
  p{margin:8px 0}
  .muted{color:var(--ink3)}
  .small{font-size:13px}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 18px;margin:14px 0;
  }
  .card.tight{padding:14px 16px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font:inherit;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;
    transition:.15s;user-select:none;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06);color:#fff}
  .btn.ghost{border-style:dashed}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tag{
    display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;
    background:var(--accent-weak);color:var(--accent);line-height:1.6;
  }
  .tag.gray{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
  .tag.ok{background:var(--ok-weak);color:var(--ok)}
  .tag.bad{background:var(--bad-weak);color:var(--bad)}
  .grid{display:grid;gap:12px}
  @media (min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}}
  .kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;color:var(--ink2);background:var(--bg)}

  /* ---------- home ---------- */
  .hero{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:720px){.hero{grid-template-columns:1.35fr .65fr}}
  .big{font-size:15px;color:var(--ink2)}
  .statline{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .stat b{display:block;font-size:20px;line-height:1.2}
  .entry{display:flex;flex-direction:column;gap:6px;cursor:pointer}
  .entry:hover{border-color:var(--accent)}
  .entry .t{font-weight:600}
  .entry .d{font-size:13px;color:var(--ink2)}

  /* ---------- cards(速记) ---------- */
  .search{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);font:inherit;font-size:14px;outline:none;
  }
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .group-title{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-weight:700;font-size:15px}
  .group-title .bar{width:4px;height:16px;border-radius:2px;background:var(--accent)}
  .kcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
  .kcard>.head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  .kcard>.head:hover{background:var(--accent-weak)}
  .kcard .q-text{font-weight:600;flex:1}
  .kcard .body{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
  .kcard.open .body{display:block}
  .kcard.open .chev{transform:rotate(90deg)}
  .chev{transition:.2s;color:var(--ink3);font-size:12px}
  .kcard ul{margin:10px 0 0;padding-left:20px}
  .kcard li{margin:5px 0}
  .kcard li b{color:var(--accent)}
  .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent;flex:0 0 auto}
  .kcard.mastered .mark{background:var(--ok);border-color:var(--ok);color:#fff}

  /* ---------- quiz ---------- */
  .quizbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
  .prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
  .prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .qstem{font-size:16px;line-height:1.75;margin:6px 0 16px}
  .qstem .blank{display:inline-block;min-width:88px;border-bottom:2px solid var(--accent);height:1.1em;vertical-align:-2px}
  .ansrow{display:flex;gap:10px;flex-wrap:wrap}
  input.answer{
    flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;font-size:15px;outline:none;
  }
  input.answer:focus{border-color:var(--accent);background:var(--paper)}
  .opt{
    display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:10px;
    border:1.5px solid var(--line);background:var(--paper);font:inherit;font-size:15px;cursor:pointer;
  }
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--accent-weak)}
  .opt.right{border-color:var(--ok);background:var(--ok-weak)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-weak)}
  .feedback{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:14px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--ok-weak);border:1px solid var(--ok)}
  .feedback.bad{background:var(--bad-weak);border:1px solid var(--bad)}
  .feedback .ttl{font-weight:700;margin-bottom:4px}
  .feedback.ok .ttl{color:var(--ok)}
  .feedback.bad .ttl{color:var(--bad)}
  .feedback .ans{margin:6px 0;padding:8px 10px;background:var(--paper);border-radius:8px;border:1px dashed var(--line)}
  .qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
  .dots{display:flex;gap:4px;flex-wrap:wrap;max-width:100%}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.cur{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- draw ---------- */
  .figure{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;text-align:center}
  .figure img{max-width:100%;height:auto;display:block;margin:0 auto}
  .figcap{font-size:12px;color:var(--ink3);margin-top:6px}
  table.dim{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
  table.dim th,table.dim td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  table.dim th{background:var(--bg);font-weight:600}
  ol.req,ul.req{margin:8px 0;padding-left:22px}
  ol.req li,ul.req li{margin:5px 0}

  /* ---------- exam ---------- */
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  .clock.warn{color:var(--bad)}

  /* ---------- scope ---------- */
  .chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .chk:last-child{border-bottom:0}
  .chk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent)}
  .chk span{flex:1}
  .chk.done span{color:var(--ink3);text-decoration:line-through}

  footer.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;
    transition:.25s;z-index:50;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:380px){
    body{font-size:14.5px}
    .wrap{padding:0 12px 60px}
    .card{padding:14px}
  }
  @media (max-width:480px){
    .brand small{display:none}
    .qcard{padding:16px}
    h1{font-size:19px}
    .statline{gap:12px}
  }
  @media print{header.top,nav.tabs,.btn,.toast{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brand">电子线路CAD 复习<small>Altium Designer · 第 1～9 章</small></div>
      <div class="spacer"></div>
      <div class="ringwrap" id="ringwrap" title="点击查看进度详情">
        <svg class="ring" viewBox="0 0 36 36">
          <circle class="bg" cx="18" cy="18" r="15"></circle>
          <circle class="fg" id="ringfg" cx="18" cy="18" r="15" stroke-dasharray="0 94.2"></circle>
        </svg>
        <span class="pct" id="pcttext">0%</span>
      </div>
      <button class="btn sm" id="themebtn" title="切换深色/浅色">◐</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="home" class="on">概览</button>
      <button data-view="cards">速记</button>
      <button data-view="quiz">刷题</button>
      <button data-view="draw">作图</button>
      <button data-view="exam">模拟考</button>
      <button data-view="scope">范围</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   数据
   ========================================================= */
const DATA = {
  fill: [
    {id:"f01", n:"①", q:"Altium Designer 中，原理图文件的默认后缀是 ________。", a:".SchDoc", accept:[".schdoc","schdoc","sch"], tip:"原理图 = Schematic Document，扩展名 .SchDoc。"},
    {id:"f02", n:"②", q:"PCB 文件的默认后缀是 ________。", a:".PcbDoc", accept:[".pcbdoc","pcbdoc","pcb"], tip:"PCB Document，扩展名 .PcbDoc；与之相近的 .PcbLib 是封装库。"},
    {id:"f03", n:"③", q:"原理图元件库（电气图形符号库）文件的后缀是 ________。", a:".SchLib", accept:[".schlib","schlib"], tip:"SchLib = Schematic Library；封装库是 PcbLib，别混。"},
    {id:"f04", n:"④", q:"元件 PCB 封装库文件的后缀是 ________。", a:".PcbLib", accept:[".pcblib","pcblib"], tip:"PcbLib 里每个元件是一个封装图（焊盘 + 丝印轮廓 + 3D 模型）。"},
    {id:"f05", n:"⑤", q:"未编译的集成库文件包的后缀是 ________。", a:".LibPkg", accept:[".libpkg","libpkg"], tip:"LibPkg 是“厂库文件包”，编译后生成 IntLib。IntLib 不能再装入编辑器修改，只能 Extract Sources。"},
    {id:"f06", n:"⑥", q:"集成库文件包编译后生成的集成库文件后缀是 ________。", a:".IntLib", accept:[".intlib","intlib"], tip:"IntLib 内集成符号、封装、仿真模型、信号完整性模型、3D 模型。"},
    {id:"f07", n:"⑦", q:"PCB 工程项目文件（项目文件）的后缀是 ________。", a:".PrjPcb", accept:[".prjpcb","prjpcb"], tip:"项目文件把原理图、PCB、库、输出文件组织在一起，由 Projects 面板管理。"},
    {id:"f08", n:"⑧", q:"原理图中凡是名称相同就被认为电气相连的元素叫 ________。", a:"网络标号", accept:["网络标号","网络标签","netlabel","net label","标号"], tip:"网络标号（Net Label）具有电气属性；总线、总线分支没有。"},
    {id:"f09", n:"⑨", q:"把多条平行导线“捆”在一起、本身没有电气属性的示意性连线叫 ________。", a:"总线", accept:["总线","bus"], tip:"总线要靠网络标号 + 总线标号 P0[0..7] 才真正建立连接。"},
    {id:"f10", n:"⑩", q:"原理图层面的电气规则检查，英文简称是 ________。", a:"ERC", accept:["erc","电气规则检查"], tip:"ERC = Electrical Rules Check，Project ▸ Compile 时执行。"},
    {id:"f11", n:"⑪", q:"PCB 层面的设计规则检查，英文简称是 ________。", a:"DRC", accept:["drc","设计规则检查"], tip:"DRC = Design Rules Check，Tools ▸ Design Rule Check；规则本身在 Design ▸ Rules 里设。"},
    {id:"f12", n:"⑫", q:"贴片阻容 0805、0603 的编号来自 ________ 尺寸体系（08 表示长 80 mil）。", a:"英制（mil）", accept:["英制","mil","英制mil","英制（mil）","英寸"], tip:"0805 = 80 mil × 50 mil ≈ 2.0 mm × 1.25 mm；公制叫 2012。"},
    {id:"f13", n:"⑬", q:"直插封装 DIP-8 中的“8”表示 ________。", a:"引脚数为 8", accept:["引脚数","8个引脚","8只引脚","引脚数为8","八个引脚","8"], tip:"DIP-8 = 双列直插 8 脚；引脚间距 2.54 mm，两排跨距 7.62 mm。"},
    {id:"f14", n:"⑭", q:"PCB 中用于印元件外轮廓、元件序号与型号等说明性文字的层是 ________ 层。", a:"丝印（Top Overlay）", accept:["丝印","topoverlay","top overlay","丝印层"], tip:"丝印层只有标识用途，没有电气属性；丝印不能压在焊盘上。"},
    {id:"f15", n:"⑮", q:"覆盖非焊接区域、起绝缘并防止相邻焊盘桥接的层是 ________ 层。", a:"阻焊（Solder Mask）", accept:["阻焊","soldermask","solder mask","阻焊层"], tip:"阻焊层的作用是覆盖 + 绝缘 + 防桥接；焊盘能上锡是“开窗”这一结果，别把结果当作用。"},
    {id:"f16", n:"⑯", q:"承载元件与网络连接关系、可用于核对原理图与 PCB 的中间文件叫 ________。", a:"网络表（Netlist）", accept:["网络表","netlist","net list"], tip:"网络表列出每个网络上有哪些元件引脚；PCB 与原理图一致性靠它核对。"},
    {id:"f17", n:"⑰", q:"把原理图中的元件封装与网络关系送入 PCB 文件的命令是 Design 菜单下的 ________。", a:"Update PCB Document", accept:["updatepcbdocument","update pcb document","更新pcb文件","更新pcb","updatepcb"], tip:"执行后先点 Execute Changes，再点 Only Show Errors 检查有无报错。"},
    {id:"f18", n:"⑱", q:"交付板厂生产的标准光绘（Gerber）文件格式名称是 ________。", a:"Gerber", accept:["gerber","光绘","gerber文件"], tip:"Gerber 用 ASCII 矢量描述各层图形；生成前先把原点设在板左下角。"},
    {id:"f19", n:"⑲", q:"PCB 钻孔数据由 ________ 文件提供（与 Gerber 分管两道工序）。", a:"NC Drill", accept:["ncdrill","nc drill","数控钻孔","钻孔"], tip:"NC Drill 的度量单位与精度必须与 Gerber 一致，否则叠层会有误差。"},
    {id:"f20", n:"⑳", q:"焊盘与大面积敷铜相连时采用十字（辐射状）热焊盘，目的是 ________。", a:"减缓焊盘散热，避免焊接时热量被敷铜带走造成虚焊", keywords:[["散热","热量","导热","温度"],["虚焊","焊接不良","焊不透","假焊"]], tip:"不是美观！直接连接时烙铁热量迅速被敷铜带走，焊点温度偏低→虚焊。焊盘电流 > 5 A 时才可直接连接。"},
    {id:"f21", n:"", q:"同一块印制板上，地线、电源线、信号线的宽度关系应为：", pick:["地线 ＞ 电源线 ＞ 信号线","电源线 ＞ 地线 ＞ 信号线","信号线 ＞ 电源线 ＞ 地线","三者同宽"], pickOk:0, tip:"电流越大越宽。大电流按“1 mm 线宽≈1 A”（铜厚 50 μm、温升 3 ℃）估算；内层再按 0.7～0.8 折减。"}
  ],

  judge: [
    {id:"j01", q:"阻焊层的作用是让焊盘在焊接时能够上锡。", ok:false,
     tip:"阻焊层覆盖非焊接区域，起绝缘、防桥接作用；焊盘能上锡是因为该处阻焊被开窗——这是“结果”而不是“作用”。"},
    {id:"j02", q:"总线具有与单根导线相同的电气属性，只要把几条线画到总线上，它们就真正连在一起了。", ok:false,
     tip:"总线、总线分支都只是示意性连线，没有电气属性；真正连接靠同名网络标号（或同名 I/O 端口）。"},
    {id:"j03", q:"隐藏的电源引脚只要放置到原理图上，就会自动接入 VCC 网络。", ok:false,
     tip:"隐藏电源引脚必须先指定网络名，放置后才会自动接入对应网络；网络名没设，它就没有连接。"},
    {id:"j04", q:"为减小线路压降，电源线和地线应比普通信号线画得更窄。", ok:false,
     tip:"方向反了：地线 ＞ 电源线 ＞ 信号线。窄了会发热、压降大，还可能过不了电流容量。"},
    {id:"j05", q:"0805、0603 这类贴片阻容的编号来自英制（mil）尺寸体系。", ok:true,
     tip:"0805 = 80 mil×50 mil（≈2.0 mm×1.25 mm），0603 同理；公制体系叫 2012、1608。"},
    {id:"j06", q:"表贴元件只能安装在元件面（顶层），不能放到焊锡面。", ok:false,
     tip:"表贴封装可以放底层，双面板可双面贴装（双面回流焊）；底层还可放重量轻的小元件。"},
    {id:"j07", q:"原理图符号的引脚编号与封装焊盘编号不一致时，同步到 PCB 后仍能正确建立连接。", ok:false,
     tip:"必须一一对应：原理图的连接关系是通过“引脚编号—焊盘编号”建立的，错位就会连错。"},
    {id:"j08", q:"有了 Gerber 光绘文件，钻孔文件就可以省略。", ok:false,

    {id:"j09", q:"丝印层和机械层没有电气属性，只承担标识与加工用途。", ok:true,

    {id:"j10", q:"四层板规划时，内电源层边框应比内地线层边框小 20 倍板厚以上，以减小边缘效应。", ok:true,
     tip:"这是 20H 原则：干扰源（含电源层）离地线层外边框 ≥20H，可显著减小边缘电磁辐射。"}

  short: [
    {id:"s01", q:"为何要采用层次化方法进行原理图设计？简述“自上而下”建立层次电路的操作顺序。",
     points:[
      "按功能把系统拆成若干子功能模块，每块一张图：图纸幅面小、逻辑清楚，便于阅读维护。",
      "便于分工协作：不同人画不同模块，互不干扰，审核与修改范围小。",
      "模块可复用：多通道/重复单元只画一次，用方块电路多次调用。",
      "编译与检查范围明确，出错定位快，打印装订方便。",
      "自上而下顺序：新建 PCB 工程 → 新建总图 → 放方块电路（Sheet Symbol）设模块名与文件名 → 放方块电路 I/O 端口（Sheet Entry）→ 连线 → Design ▸ Create Sheet Form Symbol 由方块自动生成模块图（端口自动带入）→ 补画模块内部电路 → Project ▸ Compile 编译检查。"],
     score:"理由 3 条得 3 分；自上而下顺序完整得 2 分。"},
    {id:"s02", q:"为什么高速 PCB 设计中推荐采用差分对布线？差分对布线要满足哪些要求？",
     points:[
      "差分信号是两条幅度相等、流向相反的信号，接收端取差值：共模干扰（电源波动、地弹、外部辐射）在两根线上等量出现，相减后抵消，抗干扰强。",
      "两根线互为回流路径，回流面积小、回路电感小，对外辐射（EMI）低，也不易被邻近信号串扰。",
      "等长：两根线长度差控制在工艺允许范围内，不足处用蛇形补偿。",
      "等间距、同层平行走线；相邻信号层内最好上下重叠。",
      "尽量不换层；必须换层时成对打过孔，并就近加回流地过孔；避免分支（残桩）。",
      "与其它网络保持 3W 以上间距，差分阻抗按叠层要求控制。"],
     score:"干扰抵消原理 2 分；等长 1 分；等距/同层平行 1 分；成对换层、避免分支、3W 各 1 分（答满 5 分即可）。"},
    {id:"s03", q:"PCB 绘制完成后，应提交哪些文件给厂家生产？为什么光绘文件与钻孔文件不能相互替代？",
     points:[
      "Gerber 光绘文件：按层输出（顶层/底层信号层、丝印层、阻焊层、钻孔图等），板厂制版的标准格式。",
      "NC Drill 数控钻孔文件：孔位坐标、孔径与钻孔参数，度量单位与精度必须与 Gerber 一致。",
      "叠层与工艺说明：板厚、铜厚（1 OZ 等）、板材 FR-4、表面处理（喷锡/OSP/沉金）、阻焊与丝印颜色、最小线宽线距、最小孔径、板厚孔径比、阻抗要求。",
      "拼板/工艺边/光学基准点要求，以及钻孔图、装配图等辅助文件。",
      "不能替代：Gerber 只记录各层“图形”，钻孔文件记录“孔的位置与孔径”（钻、铣加工数据），属两道不同工序，缺一不可。"],
     score:"Gerber 2 分；NC Drill 1 分；工艺说明 1 分；两者分工解释 1 分。"},
    {id:"s04", q:"PCB 布线中，一般对电源网络和地线网络会进行哪些特殊处理？（至少 5 条）",
     points:[
      "加宽：地线 ＞ 电源线 ＞ 信号线；大电流按 1 mm≈1 A 估算。",
      "地线用大面积敷铜或专门地平面（多层板用内地线层），保持地平面完整，尽量不在内电层布线。",
      "焊盘与大面积敷铜之间用十字（辐射状）热焊盘，避免虚焊；电流 >5 A 时才可直接连接。",
      "接地方式：中低频单点接地/分支接地，高频多点就近接平面；模拟地与数字地分开、仅一点相连。",
      "每个 IC 电源引脚就近去耦电容（另按每 10 块数字 IC 加 1 个 10 μF 级储能电容），电源先经电容再到引脚。",
      "电源/地过孔多打几个、加大孔径；减小回路面积，遵循 20H 原则。"],
     score:"每条 1 分，答满 5 条满分；缺“加宽方向”和“热焊盘”各扣 0.5 分。"},
    {id:"s05", q:"双面板 PCB 布线过程中，要注意哪些规范和规则限制？（至少 5 条）",
     points:[
      "层分配：一层作主布线层，另一层尽量作完整地平面（本质仍按单面板规范布线，只在地线层放少量连线取代飞线）。",
      "相邻信号层走线尽量正交，减小互容、互感串扰；同层平行走线遵守 3W 规则。",
      "走线短、少分支，避免直角与锐角（内角 ≥90°，推荐 135° 或圆弧）；过孔不放焊盘上、不放在贴片两焊盘之间。",
      "电源线、地线加宽，去耦电容就近放置；时钟、复位、模拟小信号等关键信号包地或远离干扰源。",
      "跨接线尽量少、不交叉、不与相邻导线平行。",
      "设计规则先行：Design ▸ Rules 设线宽、安全间距、过孔、敷铜连接；布线后 DRC 清零；丝印不压焊盘。"],
     score:"每条 1 分，答满 5 条满分；只写“要设规则”而无具体内容不给分。"},
    {id:"s06", q:"元件的原理图库文件（.SchLib）和 PCB 封装库文件（.PcbLib）分别如何创建？各写出 4 个主要步骤。",
     points:[
      "原理图库：File ▸ New ▸ Library ▸ Schematic Library 新建 .SchLib → SCH Library 面板 Add 新元件并命名 → 画外框，Add 放引脚（名称/编号/电气属性 Input·Output·Power/长度取 5 或 10 的整数倍）→ 设元件属性（前缀 U?、默认型号、Comment、参考原点）；多单元用 Tools ▸ New Part；Reports ▸ Component Rule Check + Project ▸ Compile 检查。",
      "PCB 封装库：File ▸ New ▸ Library ▸ PCB Library 新建 .PcbLib → Tools ▸ New Blank Component → Tools ▸ Library Options 设网格 → Place ▸ Pad 放焊盘（孔径/外径按引脚定，1 脚方形，坐标按 e 与跨距定位）→ Top Overlay 画本体轮廓与 1 脚标识（不压焊盘）→ Tools ▸ Component Properties 设名称高度 → Edit ▸ Set Reference 设参考点（Pin1/Center/Location）→ Reports ▸ Component Rule Check。"],
     score:"每条流程主线 2 分（新建库、建元件、画图/放焊盘、设属性）；细节（多单元、参考点、规则检查）各 0.5 分。"}
  ],

const KEY = "cad-review-v1";

try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}

const $ = (sel, r=document) => r.querySelector(sel);
const $$ = (sel, r=document) => Array.from(r.querySelectorAll(sel));
const el = (tag, attrs={}, html) => {
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "style") n.style.cssText = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  if(html != null) n.innerHTML = html;
  return n;
};
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1600); }

/* 归一化：全角→半角、去空格标点、小写 */
function norm(s){
  return String(s||"")
    .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/\u3000/g, " ")
    .replace(/\s+/g, "")
    .replace(/[．。，,、；;：:（(〔\[【]/g, "")
    .replace(/[）)〕\]】]/g, "")
    .replace(/[＞>]/g, ">")
    .replace(/[＜<]/g, "<")
    .toLowerCase();
}
function checkFill(q, input){
  const v = norm(input);
  if(!v) return false;
  if(q.keywords){
    return q.keywords.every(group => group.some(w => v.includes(norm(w))));
  }
  return (q.accept || []).some(a => {
    const na = norm(a);
    return v === na || v === na.replace(/^\./, "") || v.includes(na) || (na.includes(v) && v.length >= 3);
  });
}

  QUIZ.forEach(q => { const a = S.ans[q.id]; if(a && (a.ok === true || a.ok === false || a.self)) done++; });
  DATA.draw.forEach(d => { if(S.ans[d.id] && S.ans[d.id].self) done++; });
  return {total, done, pct: Math.round(done / total * 100)};
}
function updateRing(){
  const {pct} = progress();
  const C = 2 * Math.PI * 15;
  $("#ringfg").setAttribute("stroke-dasharray", (C * pct / 100).toFixed(1) + " " + C.toFixed(1));
  $("#pcttext").textContent = pct + "%";
}

function weakKind(){
  const stat = {fill:[0,0], judge:[0,0], short:[0,0], draw:[0,0]};
  QUIZ.forEach(q => {
    const a = S.ans[q.id]; if(!a) return;
    const t = q.type; stat[t][0]++;
    if(a.ok === true || a.self === "y") stat[t][1]++;
  });
  DATA.draw.forEach(d => { const a = S.ans[d.id]; if(a){ stat.draw[0]++; if(a.self === "y") stat.draw[1]++; } });
  const cands = Object.entries(stat).filter(([k,v]) => v[0] > 0)
    .map(([k,v]) => [k, v[1] / v[0]]).sort((a,b) => a[1] - b[1]);
  const name = {fill:"填空题", judge:"判断题", short:"简答题", draw:"作图题"};
  if(!cands.length) return "还没有答题记录。建议先从「速记」过一遍术语，再去「刷题」把填空和判断刷一遍。";
  const [k, r] = cands[0];
  if(r >= 0.85) return `目前正确率都在 85% 以上，可以试试「模拟考」限时抽题，或去「作图」练 DIP-8 与布线辨识。`;
  return `你目前的弱项是<b>${name[k]}</b>（正确率 ${Math.round(r*100)}%），建议先把对应速记卡过一遍，再重点刷这部分。`;
}

let quizState = {filter:"all", idx:0, order:null, wrong:false};

function quizPool(){
  return QUIZ.filter(q => (quizState.filter === "all" || q.type === quizState.filter)
    && (!quizState.wrong || (S.ans[q.id] && (S.ans[q.id].ok === false || S.ans[q.id].self === "n"))));
}
function wrongCount(){
  return QUIZ.filter(q => S.ans[q.id] && (S.ans[q.id].ok === false || S.ans[q.id].self === "n")).length;
}
function viewQuiz(){
  const app = $("#app"); app.innerHTML = "";
  app.appendChild(el("h1", {}, "刷题"));
  app.appendChild(el("p", {class:"big"}, "填空、判断自动判分；简答题先自己动笔，再展开要点自评。"));

  const bar = el("div", {class:"quizbar"});
  [["all","全部"],["fill","填空"],["judge","判断"],["short","简答"]].forEach(([k,t]) => {
    const b = el("button", {class:"btn sm" + (quizState.filter === k ? " primary" : "")}, t);
    b.onclick = () => { quizState.filter = k; quizState.idx = 0; viewQuiz(); };
    bar.appendChild(b);
  });
  const rnd = el("button", {class:"btn sm ghost"}, "打乱顺序");
  rnd.onclick = () => { const p = quizPool(); for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]];} quizState.order = p.map(q=>q.id); quizState.idx = 0; renderQ(); toast("已打乱"); };
  bar.appendChild(rnd);
  const wrongBtn = el("button", {class:"btn sm ghost"}, "只看错题");
  wrongBtn.onclick = () => {
    quizState.wrong = !quizState.wrong; quizState.idx = 0; quizState.order = null;
    toast(quizState.wrong ? "只显示做错/自评不会的题（共 " + wrongCount() + " 题）" : "已显示全部题目");
    viewQuiz();
  };
  bar.appendChild(wrongBtn);
  const reset = el("button", {class:"btn sm ghost"}, "清空记录");
  reset.onclick = () => { if(confirm("清空本机所有答题记录与掌握标记？")){ S = {ans:{},mastered:{},scope:{},theme:S.theme}; save(); updateRing(); viewQuiz(); } };
  const spacer = el("span", {style:"flex:1"});
  const cnt = el("span", {class:"small muted"});
  bar.append(spacer, reset, cnt);
  app.appendChild(bar);

  const holder = el("div");
  app.appendChild(holder);

  function pool(){ return quizState.order ? quizState.order.map(id => QMAP[id]).filter(Boolean) : quizPool(); }

  function renderQ(){
    const p = pool();
    if(!p.length){ holder.innerHTML = `<div class="card muted">这一类暂时没有题目。</div>`; return; }
    quizState.idx = Math.max(0, Math.min(quizState.idx, p.length - 1));
    const q = p[quizState.idx];
    cnt.textContent = `第 ${quizState.idx + 1} / ${p.length} 题`;
    holder.innerHTML = "";

    const dots = el("div", {class:"dots"});
    p.forEach((qq, i) => {
      const a = S.ans[qq.id];
      const cls = "dot" + (a ? (a.ok === true || a.self === "y" ? " ok" : (a.ok === false || a.self === "n" ? " bad" : "")) : "") + (i === quizState.idx ? " cur" : "");
      dots.appendChild(el("span", {class:cls, title:"第 " + (i+1) + " 题"}));
    });
    holder.appendChild(dots);

    const card = el("div", {class:"qcard", style:"margin-top:12px"});
    const typeName = {fill:"填空", judge:"判断", short:"简答"}[q.type];
    card.appendChild(el("div", {class:"row", style:"gap:8px;margin-bottom:6px"},
      `<span class="tag">${typeName}</span>${q.n ? `<span class="tag gray">第 ${q.n} 空</span>` : ""}`));

    if(q.type === "fill" && q.pick){ renderPick(card, q); }
    else if(q.type === "fill"){ renderFill(card, q); }
    else if(q.type === "judge"){ renderJudge(card, q); }
    else { renderShort(card, q); }
    holder.appendChild(card);

    const nav = el("div", {class:"qnav"});
    const prev = el("button", {class:"btn"}, "← 上一题");
    const next = el("button", {class:"btn primary"}, "下一题 →");
    prev.disabled = quizState.idx === 0;
    prev.onclick = () => { quizState.idx--; renderQ(); };
    next.onclick = () => { if(quizState.idx < p.length - 1){ quizState.idx++; renderQ(); } else { toast("已经是最后一题了"); } };
    nav.append(prev, next, el("span", {class:"small muted"}, "键盘：Enter 提交 / 下一题"));
    holder.appendChild(nav);
  }

  function stem(q){
    const html = esc(q.q).replace(/_{3,}/g, '<span class="blank"></span>');
    return `<div class="qstem">${html}</div>`;
  }

  function renderFill(card, q){
    card.insertAdjacentHTML("beforeend", stem(q));
    const row = el("div", {class:"ansrow"});
    const input = el("input", {class:"answer", placeholder:"输入答案，回车提交", value:(S.ans[q.id] && S.ans[q.id].last) || ""});
    const submit = el("button", {class:"btn primary"}, "提交");
    row.append(input, submit);
    card.appendChild(row);
    const fb = el("div", {class:"feedback"});
    card.appendChild(fb);

    function doCheck(){
      const v = input.value.trim();
      if(!v){ input.focus(); return; }
      const ok = checkFill(q, v);
      S.ans[q.id] = {ok, last:v, ts:Date.now()}; save(); updateRing();
      fb.className = "feedback show " + (ok ? "ok" : "bad");
      fb.innerHTML = `<div class="ttl">${ok ? "✓ 正确" : "✗ 再想想"}</div>
        <div class="ans"><b>标准答案：</b>${esc(q.a || q.pick[q.pickOk])}</div>
        <div class="small">${q.tip}</div>`;
      input.disabled = false;
      renderDotsRefresh();
    }
    submit.onclick = doCheck;
    input.addEventListener("keydown", e => {
      if(e.key === "Enter"){
        if(fb.classList.contains("show") && fb.classList.contains("ok")) { quizState.idx++; renderQ(); }
        else doCheck();
      }
    });
    setTimeout(() => input.focus(), 30);
    if(S.ans[q.id] && S.ans[q.id].ok !== undefined){
      const ok = S.ans[q.id].ok;
      fb.className = "feedback show " + (ok ? "ok" : "bad");
      fb.innerHTML = `<div class="ttl">${ok ? "✓ 上次答对" : "✗ 上次答错"}</div>
        <div class="ans"><b>标准答案：</b>${esc(q.a)}</div><div class="small">${q.tip}</div>`;
    }
  }

  function renderPick(card, q){
    card.insertAdjacentHTML("beforeend", stem(q));
    const box = el("div");
    q.pick.forEach((opt, i) => {
      const b = el("button", {class:"opt"}, esc(opt));
      b.onclick = () => {
        const ok = i === q.pickOk;
        S.ans[q.id] = {ok, last:opt, ts:Date.now()}; save(); updateRing();
        $$(".opt", box).forEach((x, k) => {
          x.classList.remove("right","wrong","sel");
          if(k === i) x.classList.add(ok ? "right" : "wrong");
          if(k === q.pickOk && !ok) x.classList.add("right");
        });
        fb.className = "feedback show " + (ok ? "ok" : "bad");
        fb.innerHTML = `<div class="ttl">${ok ? "✓ 正确" : "✗ 选错了"}</div><div class="small">${q.tip}</div>`;
        renderDotsRefresh();
      };
      box.appendChild(b);
    });
    card.appendChild(box);
    const fb = el("div", {class:"feedback"});
    card.appendChild(fb);
  }

  function renderJudge(card, q){
    card.insertAdjacentHTML("beforeend", stem(q));
    const row = el("div", {class:"ansrow"});
    [{v:true,t:"√ 正确"},{v:false,t:"× 错误"}].forEach(o => {
      const b = el("button", {class:"btn", style:"flex:1;padding:14px"}, o.t);
      b.onclick = () => {
        const ok = (o.v === q.ok);
        S.ans[q.id] = {ok, last:o.v, ts:Date.now()}; save(); updateRing();
        fb.className = "feedback show " + (ok ? "ok" : "bad");
        fb.innerHTML = `<div class="ttl">${ok ? "✓ 判断正确" : "✗ 判断错误"}</div>
          <div class="ans"><b>本题：</b>${q.ok ? "√ 正确" : "× 错误"}</div>
          <div class="small">${q.tip}</div>`;
        renderDotsRefresh();
      };
      row.appendChild(b);
    });
    card.appendChild(row);
    const fb = el("div", {class:"feedback"});
    card.appendChild(fb);
    if(S.ans[q.id] && S.ans[q.id].ok !== undefined){
      const ok = S.ans[q.id].ok;
      fb.className = "feedback show " + (ok ? "ok" : "bad");
      fb.innerHTML = `<div class="ttl">${ok ? "✓ 上次答对" : "✗ 上次答错"}</div><div class="ans"><b>本题：</b>${q.ok ? "√ 正确" : "× 错误"}</div><div class="small">${q.tip}</div>`;
    }
  }

  function renderShort(card, q){
    card.insertAdjacentHTML("beforeend", stem(q));
    const bar = el("div", {class:"row"});
    const show = el("button", {class:"btn primary"}, "展开参考答案与采分点");
    bar.appendChild(show);
    card.appendChild(bar);
    const box = el("div", {style:"display:none;margin-top:12px"});
    box.innerHTML = `<div class="card tight" style="box-shadow:none;background:var(--bg)">
        <b>答题要点</b><ul class="req">${q.points.map(p => `<li>${p}</li>`).join("")}</ul>
        <div class="small muted">采分点：${q.score}</div>
      </div>`;
    card.appendChild(box);

    const selfRow = el("div", {class:"row", style:"display:none;margin-top:12px"});
    [["y","✓ 能答上来","primary"],["h","△ 漏了几条",""],["n","✗ 完全不会",""]].forEach(([k,t,cls]) => {
      const b = el("button", {class:"btn sm " + cls}, t);
      b.onclick = () => {
        const a = S.ans[q.id] || {};
        S.ans[q.id] = Object.assign({}, a, {self:k, ok:(k==="y"), ts:Date.now()});
        save(); updateRing(); renderDotsRefresh();
        $$("button", selfRow).forEach(x => x.classList.remove("primary"));
        b.classList.add("primary");
        toast("已记录自评");
      };
      selfRow.appendChild(b);
    });
    card.appendChild(selfRow);

    show.onclick = () => {
      box.style.display = "block";
      selfRow.style.display = "flex";
      show.textContent = "已展开，请对照自评 ↓";
      show.disabled = true;
      if(S.ans[q.id] && S.ans[q.id].self){
        const map = {y:0,h:1,n:2};
        const btns = $$("button", selfRow);
        btns[map[S.ans[q.id].self]].classList.add("primary");
      }
    };
  }

  renderQ();
}

function renderDotsRefresh(){
  const p = quizState.order ? quizState.order.map(id => QMAP[id]).filter(Boolean) : quizPool();
  const dots = $$(".dots .dot");
  if(dots.length !== p.length) return;
  p.forEach((qq, i) => {
    const a = S.ans[qq.id];
    dots[i].className = "dot" + (a ? ((a.ok === true || a.self === "y") ? " ok" : ((a.ok === false || a.self === "n") ? " bad" : "")) : "") + (i === quizState.idx ? " cur" : "");
  });
}

        box.appendChild(ul);
        const self = el("div", {class:"row", style:"margin-top:12px"});
        [["y","✓ 能画出来"],["h","△ 会画但漏细节"],["n","✗ 不会"]].forEach(([k,t]) => {
          const b = el("button", {class:"btn sm"}, t);
          b.onclick = () => {
            S.ans[d.id] = {self:k, ok:(k==="y"), ts:Date.now()}; save(); updateRing();
            $$("button", self).forEach(x => x.classList.remove("primary"));
            b.classList.add("primary"); toast("已记录自评");
          };
          self.appendChild(b);
        });
        box.appendChild(self);
      }
      const open = box.style.display === "block";
      box.style.display = open ? "none" : "block";
      btn.textContent = open ? "查看答案与采分点" : "收起答案";
    };
    app.appendChild(card);
  });
}

/* =========================================================
   视图：模拟考
   ========================================================= */
let exam = null;

function viewExam(){
  const app = $("#app"); app.innerHTML = "";
  app.appendChild(el("h1", {}, "模拟考"));
  if(!exam){
    const intro = el("div", {class:"card"});
    intro.innerHTML = `
      <p>限时 <b>45 分钟</b>，从题库随机抽取：</p>
      <ul class="req">
        <li>填空 10 题 × 2 分 = 20 分（自动判分）</li>
        <li>判断 10 题 × 1 分 = 10 分（自动判分）</li>
        <li>简答 3 题 × 5 分 = 15 分（交卷后对照自评）</li>
        <li>作图 1 题 × 10 分（交卷后对照自评）</li>
      </ul>
      <p class="small muted">合计 55 分，交卷后给出折算百分比。刷新页面会中断本次考试。</p>`;
    const go = el("button", {class:"btn primary", style:"margin-top:6px"}, "开始考试");
    go.onclick = startExam;
    intro.appendChild(go);
    app.appendChild(intro);
    return;
  }
  renderExam();
}

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function startExam(){
  const fills = shuffle(DATA.fill).slice(0,10);
  const judges = shuffle(DATA.judge).slice(0,10);
  const shorts = shuffle(DATA.short).slice(0,3);
  const draws = shuffle(DATA.draw).slice(0,1);
  exam = {
    start: Date.now(), end: Date.now() + 45*60*1000,
    items: [...fills.map(q=>({...q,type:"fill"})), ...judges.map(q=>({...q,type:"judge"})), ...shorts.map(q=>({...q,type:"short"})), ...draws.map(q=>({...q,type:"exdraw"}))],
    ans: {}, submitted:false, idx:0
  };
  renderExam();
}

function renderExam(){
  const app = $("#app"); app.innerHTML = "";
  const head = el("div", {class:"row", style:"justify-content:space-between;margin:6px 0 10px"});
  head.innerHTML = `<h1 style="margin:0">模拟考中</h1><div class="row"><span class="clock" id="clock"></span>
    <button class="btn sm" id="submit">交卷</button></div>`;
  app.appendChild(head);
  const tip = el("div", {class:"small muted"}, "客观题当场判分但不影响总分；主观题写在纸上，交卷后对照自评。");
  app.appendChild(tip);

  const holder = el("div");
  app.appendChild(holder);
  const nav = el("div", {class:"qnav"});
  const prev = el("button", {class:"btn"}, "← 上一题");
  const next = el("button", {class:"btn primary"}, "下一题 →");
  nav.append(prev, next, el("span", {class:"small muted", id:"examCount"}));
  app.appendChild(nav);

  $("#submit").onclick = submitExam;

  function tick(){
    const left = Math.max(0, exam.end - Date.now());
    const m = String(Math.floor(left/60000)).padStart(2,"0");
    const s = String(Math.floor(left%60000/1000)).padStart(2,"0");
    const c = $("#clock"); if(!c) return;
    c.textContent = "⏱ " + m + ":" + s;
    c.classList.toggle("warn", left < 5*60*1000);
    if(left <= 0 && !exam.submitted){ toast("时间到，自动交卷"); submitExam(); return; }
    if(!exam.submitted) setTimeout(tick, 500);
  }
  tick();

  function draw(){
    const q = exam.items[exam.idx];
    holder.innerHTML = "";
    $("#examCount").textContent = `第 ${exam.idx+1} / ${exam.items.length} 题`;
    const card = el("div", {class:"qcard"});
    const label = {fill:"填空", judge:"判断", short:"简答", exdraw:"作图"}[q.type];
    card.appendChild(el("div", {class:"row"}, `<span class="tag">${label}</span><span class="tag gray">第 ${exam.idx+1} 题</span>`));

    if(q.type === "fill" && q.pick){
      card.insertAdjacentHTML("beforeend", `<div class="qstem">${esc(q.q)}</div>`);
      const box = el("div");
      q.pick.forEach((opt,i) => {
        const b = el("button", {class:"opt" + (exam.ans[q.id] === i ? " sel" : "")}, esc(opt));
        b.onclick = () => { exam.ans[q.id] = i; draw(); };
        box.appendChild(b);
      });
      card.appendChild(box);
    } else if(q.type === "fill"){
      card.insertAdjacentHTML("beforeend", `<div class="qstem">${esc(q.q).replace(/_{3,}/g,"<span class=\"blank\"></span>")}</div>`);
      const input = el("input", {class:"answer", style:"width:100%", placeholder:"作答后按 Enter 跳到下一题", value: exam.ans[q.id] || ""});
      input.addEventListener("input", () => { exam.ans[q.id] = input.value; });
      input.addEventListener("keydown", e => { if(e.key === "Enter"){ if(exam.idx < exam.items.length-1){ exam.idx++; draw(); } } });
      card.appendChild(input);
      setTimeout(()=>input.focus(), 30);
    } else if(q.type === "judge"){
      card.insertAdjacentHTML("beforeend", `<div class="qstem">${esc(q.q)}</div>`);
      const row = el("div", {class:"ansrow"});
      [{v:true,t:"√ 正确"},{v:false,t:"× 错误"}].forEach(o => {
        const b = el("button", {class:"btn" + (exam.ans[q.id] === o.v ? " primary" : ""), style:"flex:1;padding:14px"}, o.t);
        b.onclick = () => { exam.ans[q.id] = o.v; draw(); };
        row.appendChild(b);
      });
      card.appendChild(row);
    } else if(q.type === "short"){
      card.insertAdjacentHTML("beforeend", `<div class="qstem">${esc(q.q)}</div><p class="small muted">在纸上作答，交卷后对照要点自评。</p>`);
    } else {
      card.insertAdjacentHTML("beforeend", `<div class="qstem">${esc(q.title)}（${q.score}）</div>`);
      const ol = el("ol", {class:"req"}); q.req.forEach(r => ol.appendChild(el("li", {}, esc(r))));
      card.appendChild(ol);
      if(q.qimg) card.appendChild(el("div", {class:"figure"}, `<img src="${q.qimg}" alt="题图">`));
      card.appendChild(el("p", {class:"small muted"}, "在纸上作图，交卷后对照答案图自评。"));
    }
    holder.appendChild(card);
  }
  prev.onclick = () => { exam.idx = Math.max(0, exam.idx-1); draw(); };
  next.onclick = () => { exam.idx = Math.min(exam.items.length-1, exam.idx+1); draw(); };
  prev.disabled = exam.idx === 0;
  draw();
}

function submitExam(){
  if(!exam || exam.submitted) return;
  exam.submitted = true;
  const app = $("#app");
  app.innerHTML = "";
  app.appendChild(el("h1", {}, "模拟考结果"));

  let autoScore = 0, autoTotal = 0, right = 0, wrong = 0;
  const wrongList = [];
  exam.items.forEach(q => {
    if(q.type === "fill" && q.pick){
      autoTotal += 2;
      const ok = exam.ans[q.id] === q.pickOk;
      if(ok){ autoScore += 2; right++; } else { wrong++; wrongList.push(q); }
    } else if(q.type === "fill"){
      autoTotal += 2;
      const ok = checkFill(q, exam.ans[q.id] || "");
      if(ok){ autoScore += 2; right++; } else { wrong++; wrongList.push(q); }
    } else if(q.type === "judge"){
      autoTotal += 1;
      const ok = exam.ans[q.id] === q.ok;
      if(ok){ autoScore += 1; right++; } else { wrong++; wrongList.push(q); }
    }
  });

  const subj = exam.items.filter(q => q.type === "short" || q.type === "exdraw");
  const head = el("div", {class:"card"});
  head.innerHTML = `<div class="row" style="justify-content:space-between">
      <div><b>客观题</b><div class="small muted">填空 + 判断，自动判分</div></div>
      <div style="font-size:22px;font-weight:700">${autoScore} / ${autoTotal}</div></div>
    <div class="prog"><i style="width:${autoTotal ? (autoScore/autoTotal*100) : 0}%"></i></div>
    <div class="small muted">答对 ${right} 题，答错 ${wrong} 题。主观题请对照下面的要点自评，满分 25 分。</div>`;
  app.appendChild(head);

  if(wrongList.length){
    app.appendChild(el("h2", {}, "答错的客观题"));
    wrongList.forEach(q => {
      const c = el("div", {class:"card tight"});
      const ansText = q.type === "judge" ? (q.ok ? "√ 正确" : "× 错误") : (q.a || (q.pick && q.pick[q.pickOk]));
      c.innerHTML = `<div class="small"><span class="tag bad">${({fill:"填空",judge:"判断"})[q.type]}</span> ${esc(q.q)}</div>
        <div class="small" style="margin-top:6px"><b>正确答案：</b>${esc(ansText)}</div>
        <div class="small muted">${q.tip || ""}</div>`;
      app.appendChild(c);
    });
  }

  app.appendChild(el("h2", {}, "主观题自评"));
  const sbox = el("div");
  app.appendChild(sbox);
  let selfScore = 0;
  subj.forEach(q => {
    const c = el("div", {class:"card"});
    const pts = q.type === "short" ? q.points : q.ans;
    c.innerHTML = `<b>${esc(q.q || q.title)}</b>
      <div class="card tight" style="box-shadow:none;background:var(--bg);margin-top:8px">
        <ul class="req">${pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        <div class="small muted">采分点：${esc(q.score && q.type === "short" ? q.score : (q.cai || q.score))}</div>
      </div>`;
    const row = el("div", {class:"row", style:"margin-top:10px"});
    const full = q.type === "short" ? 5 : 10;
    [["y", "满分"],["h", "半分"],["n", "不得分"]].forEach(([k,t]) => {
      const b = el("button", {class:"btn sm"}, t);
      b.onclick = () => {
        const a = S.ans[q.id] || {};
        S.ans[q.id] = Object.assign({}, a, {self:k, ok:(k==="y"), ts:Date.now()});
        save(); updateRing(); toast("已记录");
        $$("button", row).forEach(x => x.classList.remove("primary"));
        b.classList.add("primary");
      };
      row.appendChild(b);
    });
    c.appendChild(row);
    sbox.appendChild(c);
  });

  const again = el("div", {class:"row", style:"margin-top:16px"});
  const b1 = el("button", {class:"btn primary"}, "再来一次");
  b1.onclick = () => { exam = null; startExam(); };
  const b2 = el("button", {class:"btn"}, "回到概览");
  b2.onclick = () => { exam = null; go("home"); };
  again.append(b1, b2);
  app.appendChild(again);
}

/* =========================================================
   视图：复习范围
   ========================================================= */
function viewScope(){
  const app = $("#app"); app.innerHTML = "";
  app.appendChild(el("h1", {}, "复习范围与要点"));
  app.appendChild(el("p", {class:"big"}, "这是老师给的《复习范围及要点》原文条目，勾掉即表示已掌握（打勾存在本机）。"));
  DATA.scope.forEach((g, gi) => {
    const card = el("div", {class:"card"});
    card.appendChild(el("h3", {style:"margin-top:0"}, esc(g.t)));
    g.items.forEach((t, ii) => {
      const key = gi + "-" + ii;
      const lab = el("label", {class:"chk" + (S.scope[key] ? " done" : "")});
      const cb = el("input", {type:"checkbox"});
      cb.checked = !!S.scope[key];
      cb.onchange = () => { S.scope[key] = cb.checked; lab.classList.toggle("done", cb.checked); save(); };
      lab.append(cb, el("span", {}, esc(t)));
      card.appendChild(lab);
    });
    app.appendChild(card);
  });
}

/* =========================================================
   路由
   ========================================================= */
const VIEWS = {home:viewHome, cards:viewCards, quiz:viewQuiz, draw:viewDraw, exam:viewExam, scope:viewScope};
function go(v){
  if(v === "print"){ window.print(); return; }
  if(!VIEWS[v]) v = "home";
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  location.hash = v;
  VIEWS[v]();
  window.scrollTo({top:0, behavior:"instant"});
  updateRing();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if(t){ go(t.dataset.go); }
});
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if(b) go(b.dataset.view);
});
$("#themebtn").onclick = () => {
  S.theme = S.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = S.theme; save();
};
$("#ringwrap").onclick = () => {
  const {total, done, pct} = progress();
  toast(`已完成 ${done}/${total}（${pct}%）：客观题按对错计，主观题按自评计`);
};
try{ const qp = new URLSearchParams(location.search); const th = qp.get("theme"); if(th === "dark" || th === "light") S.theme = th; }catch(e){}
document.documentElement.dataset.theme = S.theme || "light";
go((location.hash || "#home").slice(1));
updateRing();
</script>
